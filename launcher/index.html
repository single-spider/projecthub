<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProjectHub · Launcher</title><link rel="stylesheet" href="styles.css"></head>
<body><main id="launcher" class="launcher dormant" aria-label="ProjectHub launcher">
  <header class="brand"><span class="eyebrow">PROJECTHUB LAUNCHER</span><span class="tagline">MECHANICAL CONTEXT TREE</span></header>
  <section class="stage" aria-live="polite"><div class="machine-shadow"></div><div id="machine" class="machine" tabindex="0">
    <div class="track track-a"></div><div class="track track-b"></div><div class="aperture"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <svg id="radial" viewBox="0 0 760 760" role="group" aria-label="Navigation choices"></svg>
    <button id="core" class="core" type="button" aria-label="Back to previous level"><span class="core-mark">✦</span><strong id="core-label">PROJECTHUB</strong><small id="core-hint">SUMMON</small></button>
  </div><aside id="context" class="context" hidden><div class="context-kicker">SELECTED MODULE</div><div class="context-title"><span id="context-icon">⌁</span><span id="context-label">—</span></div><p id="context-description">Hover a plate to inspect its function.</p><div class="context-rule"></div><span class="context-meta">ACTION / TOOL</span></aside></section>
  <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
  <button id="demo-open" class="demo-open" type="button">Open launcher <kbd>Ctrl + Space</kbd></button>
  <footer><span>FOCUS · BUILD · PROGRESS</span><span class="status"><b></b><em id="status-text">DORMANT</em></span></footer>
</main><script src="mock-data.js"></script><script src="tree.js"></script><script src="renderer.js"></script></body></html>
